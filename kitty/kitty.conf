# cursor trail (smear)
cursor_trail 3
cursor_trail_decay 0.1 0.4

# tab bar
tab_bar_style hidden
map ctrl+shift+t select_tab
hide_window_decorations titlebar-only

# Keybinds
map shift+enter send_text all \x1b\r
map opt+enter toggle_maximized
map cmd+enter no_op

# Font
# font_family JetBrainsMono Nerd Font
font_size 18.0

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME



# BEGIN_KITTY_FONTS
font_family      family="Menlo"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

